spring.application.name=simple-crm

# Render (and most PaaS) injects the assigned port here.
server.port=${PORT:8080}

# Enables the H2 console, which is a UI for the H2 database.
#spring.h2.console.enabled=true
# The URL path to the H2 console.
#spring.h2.console.path=/h2
# The JDBC URL for the H2 database.
#spring.datasource.url=jdbc:h2:mem:simple-crm

#PostgreSQL — all overridable via environment variables (Render sets these).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/simple_crm}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# create = drop and recreate the schema on every restart (wipes data).
# update = create tables if missing, keep existing rows (safe for Render cold starts).
spring.jpa.hibernate.ddl-auto=update

jwt.secret=${JWT_SECRET:replace-this-with-a-long-random-secret-key-for-training-only}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}





